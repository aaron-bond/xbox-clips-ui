<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06192b" />
    <!-- Installable app (PLAN-v1.md §11, P5). No service worker: installing doesn't need one. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Xbox Clips" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@400;600&display=swap"
    />
    <title>Xbox Clips</title>
    <meta name="description" content="Every gamertag has a highlight reel. Look up any Xbox player and share their clips." />
    <!-- Generic preview tags. On /clip/* the preview function replaces them with the clip's own. -->
    <meta property="og:site_name" content="Xbox Clips" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xbox Clips" />
    <meta property="og:description" content="Every gamertag has a highlight reel. Look up any Xbox player and share their clips." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
